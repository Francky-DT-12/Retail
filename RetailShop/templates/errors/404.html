<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Non Trouvée - SHOP.CO</title>
    <link rel="icon" href="{{ url_for('static', filename='image/other/logo_icon.png') }}" type="image/x-icon">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modern-style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modern-homepage.css') }}">
    <style>
        .error-container {
            text-align: center;
            padding: 100px 0;
        }
        .error-code {
            font-size: 120px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }
        .error-message {
            font-size: 24px;
            color: #555;
            margin-bottom: 30px;
        }
        .back-home {
            display: inline-block;
            background-color: #000;
            color: #fff;
            padding: 12px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .back-home:hover {
            background-color: #333;
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .error-image {
            max-width: 100%;
            height: auto;
            margin: 30px 0;
        }
    </style>
</head>
<body>
    {% include 'includes/_modern_navbar.html' %}
    
    <div class="container">
        <div class="error-container">
            <div class="error-code">404</div>
            <div class="error-message">Oops! La page que vous recherchez n'existe pas.</div>
            <img src="{{ url_for('static', filename='image/other/404-image.png') }}" alt="404 Error" class="error-image" onerror="this.style.display='none'">
            <p>Nous ne trouvons pas la page que vous recherchez. Elle a peut-être été déplacée ou supprimée.</p>
            <a href="{{ url_for('index') }}" class="back-home">
                <i class="fas fa-home"></i> Retour à l'accueil
            </a>
        </div>
    </div>
    
    <!-- Bootstrap and jQuery for dropdown functionality -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js"></script>
    
    <!-- Custom modern script -->
    <script src="{{ url_for('static', filename='js/modern-script.js') }}"></script>
</body>
{% include 'includes/_footer.html' %}
</html>
